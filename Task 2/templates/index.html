<!DOCTYPE html>
<html>
<head>
    <title>Credit Card Fraud Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💳 Credit Card Fraud Detection</h1>

    <form action="/predict" method="POST">

        <div class="grid">

            <div>
                <label>Transaction Amount</label>
                <input type="number" step="0.01" name="amt" required>
            </div>

            <div>
                <label>Category</label>
                <input type="text" name="category" placeholder="grocery_pos" required>
            </div>

            <div>
                <label>Gender</label>
                <select name="gender">
                    <option value="F">Female</option>
                    <option value="M">Male</option>
                </select>
            </div>

            <div>
                <label>State</label>
                <input type="text" name="state" placeholder="NC" required>
            </div>

            <div>
                <label>Customer Latitude</label>
                <input type="number" step="any" name="lat" required>
            </div>

            <div>
                <label>Customer Longitude</label>
                <input type="number" step="any" name="long" required>
            </div>

            <div>
                <label>City Population</label>
                <input type="number" name="city_pop" required>
            </div>

            <div>
                <label>Merchant Latitude</label>
                <input type="number" step="any" name="merch_lat" required>
            </div>

            <div>
                <label>Merchant Longitude</label>
                <input type="number" step="any" name="merch_long" required>
            </div>

            <div>
                <label>Transaction Hour</label>
                <input type="number" min="0" max="23" name="trans_hour" required>
            </div>

            <div>
                <label>Day of Week</label>
                <input type="number" min="0" max="6" name="trans_day_of_week" required>
            </div>

            <div>
                <label>Transaction Month</label>
                <input type="number" min="1" max="12" name="trans_month" required>
            </div>

            <div>
                <label>Customer Age</label>
                <input type="number" name="age" required>
            </div>

            <div>
                <label>Log Amount</label>
                <input type="number" step="any" name="log_amt" required>
            </div>

            <div>
                <label>Location Distance</label>
                <input type="number" step="any" name="location_distance" required>
            </div>

        </div>

        <button type="submit">
            🔍 Check Transaction
        </button>

    </form>

    {% if result %}
        <div class="result">
            {{ result }}
        </div>
    {% endif %}

</div>

</body>
</html>
