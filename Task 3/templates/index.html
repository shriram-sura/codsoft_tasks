<!DOCTYPE html>
<html>

<head>

    <title>Customer Churn Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background: #f0f2f6;
            border-radius: 10px;
        }

        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👤 Customer Churn Prediction</h1>

    <div class="subtitle">
        Predict whether a customer is likely to leave the bank
    </div>

    <form action="/predict" method="POST">

        <div class="grid">

            <div>
                <label>Credit Score</label>
                <input
                    type="number"
                    name="CreditScore"
                    required
                >
            </div>

            <div>
                <label>Geography</label>

                <select name="Geography" required>

                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Spain">Spain</option>

                </select>

            </div>

            <div>
                <label>Gender</label>

                <select name="Gender" required>

                    <option value="Male">Male</option>
                    <option value="Female">Female</option>

                </select>

            </div>

            <div>
                <label>Age</label>
                <input
                    type="number"
                    name="Age"
                    required
                >
            </div>

            <div>
                <label>Tenure</label>
                <input
                    type="number"
                    name="Tenure"
                    required
                >
            </div>

            <div>
                <label>Balance</label>
                <input
                    type="number"
                    step="0.01"
                    name="Balance"
                    required
                >
            </div>

            <div>
                <label>Number of Products</label>
                <input
                    type="number"
                    name="NumOfProducts"
                    required
                >
            </div>

            <div>
                <label>Has Credit Card</label>

                <select name="HasCrCard" required>

                    <option value="1">Yes</option>
                    <option value="0">No</option>

                </select>

            </div>

            <div>
                <label>Active Member</label>

                <select name="IsActiveMember" required>

                    <option value="1">Yes</option>
                    <option value="0">No</option>

                </select>

            </div>

            <div>
                <label>Estimated Salary</label>

                <input
                    type="number"
                    step="0.01"
                    name="EstimatedSalary"
                    required
                >

            </div>

        </div>

        <button type="submit">
            🔍 Predict Churn
        </button>

    </form>

    {% if result %}

        <div class="result">
            {{ result }}
        </div>

    {% endif %}

    <div class="info">

        <h3>Model Information</h3>

        <p>
            <strong>Model:</strong>
            Gradient Boosting
        </p>

        <p>
            <strong>Accuracy:</strong>
            86.90%
        </p>

        <p>
            <strong>F1-score:</strong>
            60.54%
        </p>

        <p>
            <strong>ROC-AUC:</strong>
            87.02%
        </p>

    </div>

</div>

</body>

</html>
